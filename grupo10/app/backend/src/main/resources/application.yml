server:
  port: 8080

spring:
  config:
    # Carrega automaticamente o .env da raiz do repositorio sem precisar exportar variaveis no terminal
    import: optional:file:../../../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/roteamento_db}
    username: sistemaRoteamento
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    sql-migration-prefix: ""
    sql-migration-separator: "_"
  jooq:
    sql-dialect: postgres