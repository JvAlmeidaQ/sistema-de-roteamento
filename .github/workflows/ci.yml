name: Validacao do Banco e Build

on:
  workflow_dispatch: # retirar esta linha e descomentar as de baixo quando chegar o momento
  # pull_request:
  #   branches: [ develop, main ]
  # push:
  #   branches: [ develop ]

jobs:
  test-database:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: roteamento_db
          POSTGRES_USER: sistemaRoteamento
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sistemaRoteamento -d roteamento_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verificar existência dos scripts
        run: |
          for f in 01_esquema 02_carga 03_verificacao; do
            if [ ! -s "grupo10/sql/$f.sql" ]; then
              echo "$f.sql não encontrado ou está vazio."
              exit 1
            fi
          done

      # Flyway aplica 01_esquema.sql e 02_carga.sql; jOOQ gera as classes; Spring compila e testa
      - name: Build (Flyway + jOOQ + testes)
        working-directory: grupo10/app/backend
        run: mvn -B verify

      - name: Testar 03_verificacao.sql
        run: |
          psql \
            -h localhost \
            -U sistemaRoteamento \
            -d roteamento_db \
            -v ON_ERROR_STOP=1 \
            -f grupo10/sql/03_verificacao.sql