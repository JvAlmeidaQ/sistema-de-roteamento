name: Validacao de Scripts SQL

on:
  workflow_dispatch:
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'grupo10/sql/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [ develop ]
    paths:
      - 'grupo10/sql/**'
      - '.github/workflows/ci.yml'

jobs:
  test-database:
    runs-on: ubuntu-latest

    env:
      PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: roteamento_db
          POSTGRES_USER: sistemaRoteamento
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sistemaRoteamento -d roteamento_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validar scripts integrados ou Logística isolada
        run: |
          if [[ -s grupo10/sql/01_esquema.sql && -s grupo10/sql/02_carga.sql && -s grupo10/sql/03_verificacao.sql ]]; then
            for script in 01_esquema.sql 02_carga.sql 03_verificacao.sql; do
              psql -X -h localhost -U sistemaRoteamento -d roteamento_db \
                -v ON_ERROR_STOP=1 -f "grupo10/sql/$script"
            done
          elif [[ -f grupo10/sql/01_esquema.sql && ! -s grupo10/sql/01_esquema.sql &&
                  -f grupo10/sql/02_carga.sql && ! -s grupo10/sql/02_carga.sql &&
                  -f grupo10/sql/03_verificacao.sql && ! -s grupo10/sql/03_verificacao.sql ]]; then
            # Até a consolidação, executar os SQLs reais da Logística com dependências
            # temporárias. Isso não comprova a integração dos demais subdomínios.
            psql -X -h localhost -U sistemaRoteamento -d roteamento_db \
              -v ON_ERROR_STOP=1 -f grupo10/sql/testes_logistica/validar.sql
            createdb -h localhost -U sistemaRoteamento logistica_experimentos
            psql -X -h localhost -U sistemaRoteamento -d logistica_experimentos \
              -v ON_ERROR_STOP=1 -f grupo10/sql/testes_logistica/experimentos.sql
          else
            echo "Scripts gerais ausentes ou integração parcial: revisar 01, 02 e 03."
            exit 1
          fi
