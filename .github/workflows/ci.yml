name: Validacao do Banco e Build

on:
  workflow_dispatch:
  pull_request:
    branches: [ release/es, develop, main ]
  push:
    branches: [ release/es, develop ]

jobs:
  test-database:
    name: Validacao Banco e Backend
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DB_URL: jdbc:postgresql://localhost:5432/roteamento_db
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: roteamento_db
          POSTGRES_USER: sistemaRoteamento
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sistemaRoteamento -d roteamento_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verificar existência dos scripts
        run: |
          for f in 01_esquema 02_carga 03_verificacao; do
            if [ ! -s "grupo10/sql/$f.sql" ]; then
              echo "$f.sql não encontrado ou está vazio."
              exit 1
            fi
          done

      # Flyway aplica 01_esquema.sql e 02_carga.sql; jOOQ gera as classes; Spring compila e testa
      - name: Build (Flyway + jOOQ + testes)
        working-directory: grupo10/app/backend
        run: mvn -B verify -Ddb.url=jdbc:postgresql://localhost:5432/roteamento_db

      - name: Testar 03_verificacao.sql
        run: |
          psql \
            -h localhost \
            -U sistemaRoteamento \
            -d roteamento_db \
            -f grupo10/sql/03_verificacao.sql

  build-frontend:
    name: Build Frontend (full e bd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: grupo10/app/frontend/package-lock.json

      - name: Instalar dependências
        working-directory: grupo10/app/frontend
        run: npm ci

      - name: Validar TypeScript e Build ES (full)
        working-directory: grupo10/app/frontend
        run: npm run build

      - name: Validar TypeScript e Build BD (bd)
        working-directory: grupo10/app/frontend
        run: npm run build:bd
