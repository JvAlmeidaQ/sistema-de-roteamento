services:
  db:
    image: postgres:18
    container_name: postgres-dev
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: sistemaRoteamento
      POSTGRES_DB: roteamento_db
    ports:
      - "5433:5432"
      #PostgreSQL local: localhost:5432 vs PostgreSQL Docker: localhost:5433
    volumes:
      - postgres_data:/var/lib/postgresql
      # Agora apenas os arquivos 01 e 02 são executados quando o banco é criado, ou demais devem subir na mão
      - ../grupo10/sql/01_esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
      - ../grupo10/sql/02_carga.sql:/docker-entrypoint-initdb.d/02_carga.sql:ro

volumes:
  postgres_data:
