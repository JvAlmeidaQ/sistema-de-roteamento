services:
  db:
    image: postgres:18
    container_name: postgres-dev
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: sistemaRoteamento
      POSTGRES_DB: roteamento_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql   # Postgres 18+: sem /data no final
      # Somente leitura, para execução manual (ex.: psql -f /sql/03_verificacao.sql).
      # Não usar initdb.d: a partir da sprint 2 o Flyway aplica 01 e 02.
      - ../grupo10/sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sistemaRoteamento -d roteamento_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: